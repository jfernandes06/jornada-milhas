<section class="modal">
  <h1 mat-dialog-title>Viajante</h1>
  <div mat-dialog-content>
    <div class="selecao-idade">
      <ul>
        <li><strong>Adultos</strong></li>
        <li>(Acima de 12 anos)</li>
        <li>
          <app-button-control operacao="decrementar"></app-button-control>
          <span>1</span>
          <app-button-control operacao="incrementar"></app-button-control>
        </li>
      </ul>

      <ul>
        <li><strong>Crianças</strong></li>
        <li>(Entre 2 e 11 anos)</li>
        <li>
          <app-button-control operacao="decrementar"></app-button-control>
          <span>0</span>
          <app-button-control operacao="incrementar"></app-button-control>
        </li>
      </ul>

      <ul>
        <li><strong>Bebês</strong></li>
        <li>(Até 2 anos)</li>
        <li>
          <app-button-control operacao="decrementar"></app-button-control>
          <span>0</span>
          <app-button-control operacao="incrementar"></app-button-control>
        </li>
      </ul>
    </div>

    <div class="selecao-categoria">
      <p><strong>Categoria</strong></p>

      <mat-chip-listbox aria-label="Categoria">
        <mat-chip-option>Executiva</mat-chip-option>
        <mat-chip-option selected>Econômica</mat-chip-option>
      </mat-chip-listbox>
    </div>
  </div>

  <div class="modal-actions" mat-dialog-actions>
    <button mat-flat-button color="primary" mat-dialog-close>BUSCAR</button>
  </div>
</section>
